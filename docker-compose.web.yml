## Run: docker compose -f docker-compose.yml -f docker-compose.web.yml up -d web

services:
  web:
    image: caddy:2-alpine
    ports:
      # entry point for a browser; 8080 is caddy's port
      - "127.0.0.1:${UI_PORT:-8089}:8080"
    environment:
      APP_PORT: "${PORT:-8090}" # used in Caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro # bind mount
    depends_on:
      - app
      - tools

  tools:
    build:
      context: ./apiscripts
    environment:
      PORT: "8091"
      TOOL_TIMEOUT: "${TOOL_TIMEOUT:-30s}"
    depends_on:
      - app
