services:
  app:
    build:
      context: .
      args:
        VERSION: "${VERSION:-dev}"
    ports:
      - "127.0.0.1:${PORT:-8090}:${PORT:-8090}" # loopback only
    environment:
      PORT: "${PORT:-8090}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      LOG_FILE: "${LOG_FILE:-}"
      LOG_TIME: "${LOG_TIME:-dt-milli}"
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-}" # empty -> rate limiting off
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-20}"
    depends_on:
      - redis

  redis:
    image: redis:8.8.0-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379" # loopback only; app reaches redis by service name
    volumes:
      - redis-data:/data

volumes:
  redis-data:
